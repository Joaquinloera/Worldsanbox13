name: World Sandbox Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify World Sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check hazard-sources.js
          node --check server.js

      - name: Validate JSON registries
        run: |
          node -e "JSON.parse(require('fs').readFileSync('worldsandbox.config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('america-gov.connector.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('global-institutions.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('ai-technology.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('global-security.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/global-dispensary-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/global-infrastructure-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/global-shipping-agriculture-registry.json','utf8'))"

      - name: Start unified API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/status > /dev/null; then
              echo "World Sandbox API is online"
              exit 0
            fi

            sleep 1
          done

          echo "World Sandbox API failed to start"
          cat server.log || true
          exit 1
        env:
          PORT: "3000"
          HOST: "127.0.0.1"
          WORLDSANDBOX_USER_AGENT: "Worldsandbox13-GitHub-Actions/0.3"

      - name: Test API status
        run: |
          curl --fail --silent \
            http://127.0.0.1:3000/api/status

      - name: Test global banking registry
        run: |
          curl --fail --silent \
            http://127.0.0.1:3000/api/banks

      - name: Test AI technology registry
        run: |
          curl --fail --silent \
            http://127.0.0.1:3000/api/ai-companies

      - name: Test nuclear risk registry
        run: |
          curl --fail --silent \
            http://127.0.0.1:3000/api/nuclear-risk

      - name: Test government information registry
        run: |
          curl --fail --
